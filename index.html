
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thetz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #000;
    background-image: radial-gradient(circle at top, #2a2a2a 0%, #000 75%);
    color: #fff;
    display: flex;
    justify-content: center;
    padding: 30px 15px;
}

.container {
    width: 100%;
    max-width: 500px;
}

.card {
    display: flex;
    align-items: center;
    gap: 15px;
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 18px;
    text-decoration: none;
    color: white;
    transition: .25s;
}

.card:hover,
.big-card:hover,
.social:hover {
    transform: translateY(-4px);
    border-color: white;
}

.card img {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    object-fit: cover;
}

.info h2 {
    font-size: 20px;
    font-weight: 700;
}

.info p {
    font-size: 14px;
    color: #bdbdbd;
    margin-top: 3px;
}

.big-card {
    display: block;
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 22px;
    padding: 18px;
    margin-bottom: 18px;
    text-decoration: none;
    color: white;
    transition: .25s;
}

.big-card img {
    width: 100%;
    border-radius: 16px;
    margin-bottom: 15px;
}

.big-card h2 {
    font-size: 28px;
    margin-bottom: 5px;
}

.big-card p,
.social p {
    color: #bdbdbd;
}

.social {
    display: flex;
    align-items: center;
    gap: 15px;
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 18px;
    text-decoration: none;
    color: white;
    transition: .25s;
}

.social img {
    width: 60px;
    height: 60px;
    object-fit: contain;
}

.social h2 {
    font-size: 20px;
}

.social p {
    font-size: 14px;
    margin-top: 3px;
}

footer {
    margin-top: 20px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #777;
}

footer img {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    object-fit: cover;
}
</style>
</head>

<body>
<div class="container">

    <a class="big-card"
       href="https://discord.gg/EqpgtKvkdB"
       target="_blank"
       rel="noopener noreferrer">

        <img src="https://cdn.discordapp.com/attachments/1531059796340641832/1533602744936693952/file_0000000033c0820e9886a61bff6f42e6.png?ex=6a71165b&is=6a6fc4db&hm=f3343a2d7fc94b7104bf78da3b98c818bfb47bcae8bc579ea23c97920c906c8d&">

        <h2>Comunidade</h2>
        <p>Join our Discord Community</p>
    </a>

    <a class="social"
       href="https://www.youtube.com/@thetz-n7n"
       target="_blank"
       rel="noopener noreferrer">

        <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">

        <div>
            <h2>YouTube</h2>
            <p>@thetz-n7n</p>
        </div>
    </a>

    <a class="social"
       href="https://www.tiktok.com/@thetz_8?_r=1&_t=ZS-98Yi92Fu7us"
       target="_blank"
       rel="noopener noreferrer">

        <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png">

        <div>
            <h2>TikTok</h2>
            <p>@thetz_8</p>
        </div>
    </a>

    <footer>
        <img
            src="COLOQUE_AQUI_O_LINK_DIRETO_DA_FOTO"
            alt="Nipah">

        <span>Developed by Nipah | vodka.idk</span>
    </footer>

</div>
</body>
</html>
