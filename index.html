<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
background-image:radial-gradient(circle at top,#2e2e2e 0%,#000 75%);
color:#fff;
display:flex;
justify-content:center;
padding:30px 15px;
}

.container{
width:100%;
max-width:500px;
}

.card,.big-card{
display:flex;
align-items:center;
gap:15px;
background:#111;
border:1px solid #222;
border-radius:20px;
padding:18px;
margin-bottom:18px;
text-decoration:none;
color:#fff;
transition:.3s;
}

.card:hover,.big-card:hover{
transform:translateY(-4px);
border-color:#fff;
box-shadow:0 0 20px rgba(255,255,255,.15);
}

.card img{
width:70px;
height:70px;
border-radius:50%;
object-fit:cover;
}

.info h2{
font-size:22px;
}

.info p{
color:#bdbdbd;
font-size:14px;
margin-top:3px;
}

.big-card{
display:block;
text-align:center;
}

.big-card img{
width:100%;
border-radius:18px;
margin-bottom:15px;
}

.big-card h2{
font-size:28px;
margin-bottom:8px;
}

.big-card p{
color:#bdbdbd;
}

.social{
display:flex;
align-items:center;
gap:15px;
background:#111;
border:1px solid #222;
border-radius:20px;
padding:16px;
margin-bottom:18px;
text-decoration:none;
color:#fff;
transition:.3s;
}

.social:hover{
transform:translateY(-4px);
border-color:#fff;
box-shadow:0 0 20px rgba(255,255,255,.15);
}

.social img{
width:55px;
height:55px;
}

footer{
margin-top:25px;
text-align:right;
font-size:12px;
color:#777;
}
</style>

</head>
