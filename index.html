<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
background-image:radial-gradient(circle at top,#2a2a2a 0%,#000 75%);
color:#fff;
display:flex;
justify-content:center;
padding:30px 15px;
}

.container{
width:100%;
max-width:500px;
}

.card{
display:flex;
align-items:center;
gap:15px;
background:#111;
border:1px solid #2a2a2a;
border-radius:20px;
padding:18px;
margin-bottom:18px;
text-decoration:none;
color:white;
transition:.25s;
}

.card:hover{
transform:translateY(-4px);
border-color:#fff;
}

.card img{
width:68px;
height:68px;
border-radius:50%;
object-fit:cover;
}

.info h2{
font-size:20px;
font-weight:700;
}

.info p{
font-size:14px;
color:#bdbdbd;
margin-top:3px;
}

.big-card{
display:block;
background:#111;
border:1px solid #2a2a2a;
border-radius:22px;
padding:18px;
margin-bottom:18px;
text-decoration:none;
color:white;
transition:.25s;
}

.big-card:hover{
transform:translateY(-4px);
border-color:white;
}

.big-card img{
width:100%;
border-radius:16px;
margin-bottom:15px;
}

.big-card h2{
font-size:28px;
margin-bottom:5px;
}

.big-card p{
color:#bdbdbd;
}

.social{
display:flex;
align-items:center;
gap:15px;
background:#111;
border:1px solid #2a2a2a;
border-radius:20px;
padding:18px;
margin-bottom:18px;
text-decoration:none;
color:white;
transition:.25s;
}

.social:hover{
transform:translateY(-4px);
border-color:white;
}

.social img{
width:60px;
height:60px;
}

.social h2{
font-size:20px;
}

.social p{
font-size:14px;
color:#bdbdbd;
margin-top:3px;
}

footer{
margin-top:20px;
display:flex;
justify-content:flex-end;
align-items:center;
gap:6px;
font-size:12px;
color:#777;
}

footer img{
width:18px;
height:18px;
border-radius:50%;
object-fit:cover;
}
</style>
